---
- name: Validate hosts file settings
  ansible.builtin.assert:
    that:
      - hosts_file_cloud_init_mode == "localhost"
      - hosts_file_cloud_init_config_path is match('^/')
    fail_msg: >-
      hosts_file_cloud_init_mode must be localhost and
      hosts_file_cloud_init_config_path must be an absolute path.

- name: Validate hosts file rewrites
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - |
        import ipaddress
        import json
        import sys

        try:
            entries = json.loads(sys.argv[1])
        except json.JSONDecodeError as exc:
            sys.stderr.write(f"hosts_file_rewrites is not valid JSON: {exc}\n")
            sys.exit(1)

        errors = []

        if not isinstance(entries, list):
            errors.append("hosts_file_rewrites must be a list.")
        else:
            for index, entry in enumerate(entries):
                label = f"hosts_file_rewrites[{index}]"
                if not isinstance(entry, dict):
                    errors.append(f"{label} must be a dictionary.")
                    continue

                domain = entry.get("domain")
                answer = entry.get("answer")

                if not isinstance(domain, str) or not domain.strip():
                    errors.append(f"{label}.domain must be a non-empty string.")
                elif "*" in domain:
                    errors.append(f"{label}.domain cannot contain wildcards.")
                elif any(char.isspace() for char in domain):
                    errors.append(f"{label}.domain cannot contain whitespace.")

                if not isinstance(answer, str) or not answer.strip():
                    errors.append(f"{label}.answer must be a non-empty string.")
                else:
                    try:
                        ipaddress.ip_address(answer)
                    except ValueError:
                        errors.append(f"{label}.answer must be an IPv4 or IPv6 address.")

        if errors:
            sys.stderr.write("\n".join(errors) + "\n")
            sys.exit(1)
      - "{{ hosts_file_rewrites | to_json }}"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Check for cloud-init configuration directory
  ansible.builtin.stat:
    path: /etc/cloud
  register: hosts_file_cloud_dir

- name: Ensure cloud-init drop-in directory exists
  ansible.builtin.file:
    path: "{{ hosts_file_cloud_init_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - hosts_file_manage_cloud_init | bool
    - hosts_file_cloud_dir.stat.isdir | default(false)

- name: Configure cloud-init hosts management mode
  ansible.builtin.copy:
    dest: "{{ hosts_file_cloud_init_config_path }}"
    content: |
      manage_etc_hosts: {{ hosts_file_cloud_init_mode }}
    owner: root
    group: root
    mode: "0644"
  when:
    - hosts_file_manage_cloud_init | bool
    - hosts_file_cloud_dir.stat.isdir | default(false)

- name: Manage hosts file rewrite block
  ansible.builtin.blockinfile:
    path: /etc/hosts
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK homeops hosts_file"
    block: |
      {% for rewrite in hosts_file_rewrites %}
      {{ rewrite.answer }} {{ rewrite.domain }}
      {% endfor %}
    state: "{{ 'present' if hosts_file_rewrites | length > 0 else 'absent' }}"

- name: Validate hosts file lookups
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ item.domain }}"
  loop: "{{ hosts_file_rewrites }}"
  loop_control:
    label: "{{ item.domain }}"
  register: hosts_file_lookup
  changed_when: false
  failed_when: >-
    hosts_file_lookup.rc != 0
    or (item.answer | string) not in hosts_file_lookup.stdout.split()
  when:
    - hosts_file_validate | bool
    - hosts_file_rewrites | length > 0
    - not ansible_check_mode
