---
- name: Validate certificates_replicate variables
  ansible.builtin.assert:
    that:
      - certificates_replicate_script_dir | length > 0
      - certificates_replicate_script_dir is match('^/')
      - certificates_replicate_script_path | length > 0
      - certificates_replicate_script_path is match('^/')
      - certificates_replicate_log_file | length > 0
      - certificates_replicate_log_file is match('^/')
      - certificates_replicate_shared_group | length > 0
      - certificates_replicate_dir_mode is match('^0?[0-7]{3,4}$')
      - certificates_replicate_file_mode is match('^0?[0-7]{3,4}$')
      - certificates_replicate_install_packages | type_debug == "bool"
      - certificates_replicate_install_cron | type_debug == "bool"
      - certificates_replicate_cron_schedule | length > 0
      - certificates_replicate_remote_user | length > 0
      - certificates_replicate_remote_user is not search('\\s')
      - certificates_replicate_remote_host | length > 0
      - certificates_replicate_remote_host is not search('\\s')
      - certificates_replicate_remote_base_dir | length > 0
      - certificates_replicate_remote_base_dir is match('^/')
      - certificates_replicate_remote_base_dir is not search('\\s')
      - certificates_replicate_local_base_dir | length > 0
      - certificates_replicate_local_base_dir is match('^/')
      - certificates_replicate_local_base_dir is not search('\\s')
      - certificates_replicate_items is sequence
      - certificates_replicate_items | length > 0
      - certificates_replicate_validate_run | type_debug == "bool"
      - certificates_replicate_rsync_copy_links | type_debug == "bool"
      - certificates_replicate_delete | type_debug == "bool"
      - certificates_replicate_reload_nginx | type_debug == "bool"
      - certificates_replicate_reload_apache | type_debug == "bool"
      - certificates_replicate_post_sync_commands | type_debug == "list"
      - >-
        certificates_replicate_ssh_private_key_path | length == 0
        or certificates_replicate_ssh_private_key_path is match('^/')
      - >-
        certificates_replicate_ssh_strict_host_key_checking
        | type_debug == "bool"
      - >-
        certificates_replicate_ssh_known_hosts_file | length == 0
        or certificates_replicate_ssh_known_hosts_file is match('^/')
      - certificates_replicate_ssh_extra_args | type_debug == "list"
    fail_msg: >-
      certificates_replicate needs remote_user, remote_host, at least one item,
      and valid absolute script/log paths.

- name: Validate certificate replication items
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | string | length > 0
      - item.name is match('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      Each certificates_replicate_items entry needs a safe non-empty name:
      {{ item }}
  loop: "{{ certificates_replicate_items }}"
  loop_control:
    label: "{{ item.name if (item.name is defined) else '<missing-name>' }}"

- name: Validate certificate replication post-sync commands
  ansible.builtin.assert:
    that:
      - item | string | length > 0
    fail_msg: >-
      Each certificates_replicate_post_sync_commands item must be non-empty.
  loop: "{{ certificates_replicate_post_sync_commands }}"

- name: Reset effective certificate replication items
  ansible.builtin.set_fact:
    certificates_replicate_effective_items: []

- name: Build effective certificate replication items
  ansible.builtin.set_fact:
    certificates_replicate_effective_items: >-
      {{
        certificates_replicate_effective_items + [
          item | combine({
            'remote_path': item.remote_path | default(
              certificates_replicate_remote_base_dir + '/' + item.name,
              true
            ),
            'local_path': item.local_path | default(
              certificates_replicate_local_base_dir + '/' + item.name,
              true
            )
          })
        ]
      }}
  loop: "{{ certificates_replicate_items }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate effective certificate replication paths
  ansible.builtin.assert:
    that:
      - item.remote_path | string | length > 0
      - item.remote_path is match('^/')
      - item.remote_path is not search('\\s')
      - item.local_path | string | length > 0
      - item.local_path is match('^/')
      - item.local_path is not search('\\s')
    fail_msg: >-
      Each effective certificate replication path must be absolute and
      whitespace-free: {{ item }}
  loop: "{{ certificates_replicate_effective_items }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install certificate replication packages
  ansible.builtin.package:
    name:
      - rsync
      - openssh-client
    state: present
  when: certificates_replicate_install_packages

- name: Ensure certificate sharing group exists
  ansible.builtin.group:
    name: "{{ certificates_replicate_shared_group }}"
    state: present

- name: Ensure certificate replication script directory exists
  ansible.builtin.file:
    path: "{{ certificates_replicate_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure certificate replication log directory exists
  ansible.builtin.file:
    path: "{{ certificates_replicate_log_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: certificates_replicate_install_cron

- name: Ensure local certificate directories exist
  ansible.builtin.file:
    path: "{{ item.local_path }}"
    state: directory
    owner: root
    group: "{{ certificates_replicate_shared_group }}"
    mode: "{{ certificates_replicate_dir_mode }}"
  loop: "{{ certificates_replicate_effective_items }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure certificate replication log file exists
  ansible.builtin.file:
    path: "{{ certificates_replicate_log_file }}"
    state: touch
    owner: root
    group: "{{ certificates_replicate_shared_group }}"
    mode: "{{ certificates_replicate_file_mode }}"
    modification_time: preserve
    access_time: preserve
  when: certificates_replicate_install_cron

- name: Render certificate replication script
  ansible.builtin.template:
    src: replicate-certificates.sh.j2
    dest: "{{ certificates_replicate_script_path }}"
    owner: root
    group: root
    mode: '0750'

- name: Run certificate replication validation
  ansible.builtin.command: "{{ certificates_replicate_script_path }}"
  register: certificates_replicate_validate_run_cmd
  changed_when: >-
    'Certificate changes detected'
    in certificates_replicate_validate_run_cmd.stdout
  failed_when: false
  when: certificates_replicate_validate_run

- name: Show certificate replication validation output
  ansible.builtin.debug:
    msg: >-
      {{
        certificates_replicate_validate_run_cmd.stdout_lines
        + certificates_replicate_validate_run_cmd.stderr_lines
      }}
  when: certificates_replicate_validate_run

- name: Fail when certificate replication validation failed
  ansible.builtin.fail:
    msg: >-
      Certificate replication validation failed with exit code
      {{ certificates_replicate_validate_run_cmd.rc }}.
      See log output above.
  when:
    - certificates_replicate_validate_run
    - certificates_replicate_validate_run_cmd.rc != 0

- name: Install cron for scheduled certificate replication
  ansible.builtin.copy:
    dest: /etc/cron.d/certificates-replicate
    owner: root
    group: root
    mode: '0644'
    # yamllint disable rule:line-length
    content: |
      # Pull certificates from the configured source host.
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MAILTO=""
      CERTIFICATES_REPLICATE_SCRIPT={{ certificates_replicate_script_path }}
      CERTIFICATES_REPLICATE_LOG={{ certificates_replicate_log_file }}
      # minute hour day month weekday user command
      {{ certificates_replicate_cron_schedule }} root "$CERTIFICATES_REPLICATE_SCRIPT" >>"$CERTIFICATES_REPLICATE_LOG" 2>&1
    # yamllint enable rule:line-length
  when: certificates_replicate_install_cron

- name: Remove disabled certificate replication cron
  ansible.builtin.file:
    path: /etc/cron.d/certificates-replicate
    state: absent
  when: not certificates_replicate_install_cron
