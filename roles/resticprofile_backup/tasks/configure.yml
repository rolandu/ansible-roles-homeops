---
- name: Validate Resticprofile platform, paths, and schedule
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_architecture in resticprofile_architecture_map
      - resticprofile_architecture_map[ansible_architecture] in resticprofile_checksums
      - resticprofile_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - resticprofile_group_name is match('^[A-Za-z0-9_.-]+$')
      - resticprofile_group_name not in ['version', 'global', 'groups', 'includes']
      - resticprofile_install_root is match('^/')
      - resticprofile_release_dir is match('^/')
      - resticprofile_download_dir is match('^/')
      - resticprofile_binary_path is match('^/')
      - resticprofile_config_dir is match('^/')
      - resticprofile_config_path is match('^/')
      - resticprofile_script_dir is match('^/')
      - resticprofile_script_path is match('^/')
      - resticprofile_lock_file is match('^/')
      - resticprofile_log_file is match('^/')
      - resticprofile_cron_file is match('^/etc/cron\.d/')
      - resticprofile_logrotate_file is match('^/etc/logrotate\.d/')
      - resticprofile_backup_cron is mapping
      - resticprofile_check_cron is mapping
      - resticprofile_backup_cron.minute | string is match('^([0-5]?[0-9]|\*)$')
      - resticprofile_backup_cron.hour | string is match('^([01]?[0-9]|2[0-3]|\*)$')
      - resticprofile_check_cron.minute | string is match('^([0-5]?[0-9]|\*)$')
      - resticprofile_check_cron.hour | string is match('^([01]?[0-9]|2[0-3]|\*)$')
      - resticprofile_backup_cron.day | string is match('^[0-9*/,-]+$')
      - resticprofile_backup_cron.month | string is match('^[0-9*/,-]+$')
      - resticprofile_backup_cron.weekday | string is match('^[0-9*/,-]+$')
      - resticprofile_check_cron.day | string is match('^[0-9*/,-]+$')
      - resticprofile_check_cron.month | string is match('^[0-9*/,-]+$')
      - resticprofile_check_cron.weekday | string is match('^[0-9*/,-]+$')
    fail_msg: >-
      resticprofile_backup supports Debian-family targets on x86_64, aarch64,
      and armv7l and requires absolute managed paths plus valid cron hours and
      minutes.

- name: Require at least one Resticprofile target
  ansible.builtin.assert:
    that:
      - resticprofile_targets | length > 0
    fail_msg: Define at least one item in resticprofile_targets.

- name: Set raw Resticprofile target list
  ansible.builtin.set_fact:
    _resticprofile_raw_targets: "{{ resticprofile_targets }}"
  no_log: true

- name: Validate Resticprofile targets
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name | default('') is match('^[A-Za-z0-9_.-]+$')
      - item.name | default('') not in ['version', 'global', 'groups', 'includes']
      - item.name | default('') != resticprofile_group_name
      - item.repository | default('') | string | length > 0
      - item.repository | default('') is not search('[\r\n]')
      - item.password | default('') | string | length > 0
      - item.password | default('') is not search('[\r\n]')
      - item.environment | default({}) is mapping
      - item.extra_config | default({}) is mapping
    fail_msg: >-
      Each resticprofile_targets item requires a unique, safe name plus a
      non-empty single-line repository and password. environment and
      extra_config, when present, must be mappings. Keep passwords in Vault.
  loop: "{{ _resticprofile_raw_targets }}"
  loop_control:
    label: "{{ item.name | default('invalid target') }}"
  no_log: true

- name: Build Resticprofile target name list
  ansible.builtin.set_fact:
    _resticprofile_target_names: >-
      {{ _resticprofile_raw_targets | map(attribute='name') | list }}
  no_log: true

- name: Validate Resticprofile target names are unique
  ansible.builtin.assert:
    that:
      - _resticprofile_target_names | length > 0
      - _resticprofile_target_names | unique | length == _resticprofile_target_names | length
    fail_msg: Resticprofile target names must be unique.

- name: Initialize Resticprofile target environment validation data
  ansible.builtin.set_fact:
    _resticprofile_environment_validation_data: []
  no_log: true

- name: Build Resticprofile target environment validation data
  ansible.builtin.set_fact:
    _resticprofile_environment_validation_data: >-
      {{
        (_resticprofile_environment_validation_data | default([]))
        + [
          {
            'name': item.name,
            'entries': item.environment | default({}) | dict2items
          }
        ]
      }}
  loop: "{{ _resticprofile_raw_targets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Validate Resticprofile target environment entries
  ansible.builtin.assert:
    that:
      - item.1.key is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.1.value | string is not search('[\r\n]')
    fail_msg: >-
      Resticprofile target environment keys must be shell variable names and
      values must be single-line strings.
  loop: >-
    {{ query('subelements', _resticprofile_environment_validation_data, 'entries') }}
  loop_control:
    label: "{{ item.0.name }}:{{ item.1.key | default('invalid') }}"
  no_log: true

- name: Validate Resticprofile Gatus settings
  ansible.builtin.assert:
    that:
      - resticprofile_gatus_url is match('^https?://[^\r\n]+$')
    fail_msg: >-
      Gatus notifications require an HTTP(S) base URL.
  when: resticprofile_gatus_enabled
  no_log: true

- name: Validate effective per-target Gatus settings
  ansible.builtin.assert:
    that:
      - item.gatus_endpoint_key | default(resticprofile_gatus_endpoint_key) is match('^[A-Za-z0-9_.-]+$')
      - item.gatus_token | default(resticprofile_gatus_token) | string | length > 0
      - item.gatus_token | default(resticprofile_gatus_token) is not search('[\r\n]')
    fail_msg: >-
      Every Restic target needs an effective safe Gatus endpoint key and a
      non-empty single-line bearer token when Gatus notifications are enabled.
  loop: "{{ _resticprofile_raw_targets }}"
  loop_control:
    label: "{{ item.name }}"
  when: resticprofile_gatus_enabled
  no_log: true

- name: Validate Resticprofile source paths
  ansible.builtin.assert:
    that:
      - item | string | length > 0
      - item is match('^/')
    fail_msg: Each resticprofile_sources entry must be an absolute path.
  loop: "{{ resticprofile_sources }}"

- name: Validate Resticprofile exclusions
  ansible.builtin.assert:
    that:
      - item | string | length > 0
      - item is not search('[\r\n]')
    fail_msg: Each resticprofile_excludes entry must be a non-empty single line.
  loop: "{{ resticprofile_excludes }}"

- name: Validate Resticprofile retention values
  ansible.builtin.assert:
    that:
      - item.key is match('^keep-[a-z-]+$')
      - item.value | int >= 0
    fail_msg: >-
      Resticprofile retention entries must be keep-* keys with non-negative
      integer values.
  loop: "{{ resticprofile_retention | dict2items }}"

- name: Set Resticprofile release facts
  ansible.builtin.set_fact:
    _resticprofile_release_arch: >-
      {{ resticprofile_architecture_map[ansible_architecture] }}
    _resticprofile_archive_name: >-
      resticprofile_no_self_update_{{ resticprofile_version }}_linux_{{ resticprofile_architecture_map[ansible_architecture] }}.tar.gz

- name: Install Resticprofile runtime packages
  ansible.builtin.package:
    name: "{{ resticprofile_packages }}"
    state: present
  when:
    - resticprofile_install_packages
    - resticprofile_packages | length > 0

- name: Ensure Resticprofile installation directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ resticprofile_install_root }}"
    - "{{ resticprofile_install_root }}/releases"
    - "{{ resticprofile_release_dir }}"
    - "{{ resticprofile_download_dir }}"
    - "{{ resticprofile_script_dir }}"

- name: Download pinned Resticprofile release
  ansible.builtin.get_url:
    url: >-
      {{ resticprofile_release_base_url }}/{{ _resticprofile_archive_name }}
    dest: "{{ resticprofile_download_dir }}/{{ _resticprofile_archive_name }}"
    owner: root
    group: root
    mode: '0644'
    checksum: >-
      sha256:{{ resticprofile_checksums[_resticprofile_release_arch] }}

- name: Extract pinned Resticprofile release
  ansible.builtin.unarchive:
    src: "{{ resticprofile_download_dir }}/{{ _resticprofile_archive_name }}"
    dest: "{{ resticprofile_release_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ resticprofile_release_dir }}/resticprofile"

- name: Install Resticprofile binary
  ansible.builtin.copy:
    src: "{{ resticprofile_release_dir }}/resticprofile"
    dest: "{{ resticprofile_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Ensure Resticprofile configuration directory exists
  ansible.builtin.file:
    path: "{{ resticprofile_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Initialize normalized Resticprofile target list
  ansible.builtin.set_fact:
    _resticprofile_effective_targets: []
  no_log: true

- name: Build normalized Resticprofile target list
  ansible.builtin.set_fact:
    _resticprofile_effective_targets: >-
      {{
        (_resticprofile_effective_targets | default([]))
        + [
          item
          | combine(
              {
                '_password_file': (
                  resticprofile_config_dir
                  ~ '/repository-password-' ~ item.name
                ),
                '_environment_file': (
                  resticprofile_config_dir
                  ~ '/environment-' ~ item.name
                )
              }
            )
        ]
      }}
  loop: "{{ _resticprofile_raw_targets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Write Resticprofile repository passwords
  ansible.builtin.copy:
    content: "{{ item.password }}\n"
    dest: "{{ item._password_file }}"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ _resticprofile_effective_targets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  diff: false

- name: Write Resticprofile target environments
  ansible.builtin.template:
    src: environment.j2
    dest: "{{ item._environment_file }}"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ _resticprofile_effective_targets }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _resticprofile_environment: "{{ item.environment | default({}) }}"
  when: item.environment | default({}) | length > 0
  no_log: true
  diff: false

- name: Remove unused Resticprofile target environment files
  ansible.builtin.file:
    path: "{{ item._environment_file }}"
    state: absent
  loop: "{{ _resticprofile_effective_targets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.environment | default({}) | length == 0
  no_log: true

- name: Find obsolete generated Resticprofile secret files
  ansible.builtin.find:
    paths: "{{ resticprofile_config_dir }}"
    file_type: file
    patterns:
      - repository-password-*
      - environment-*
  register: _resticprofile_generated_secret_files
  no_log: true

- name: Remove obsolete generated Resticprofile secret files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _resticprofile_generated_secret_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    _resticprofile_desired_secret_files: >-
      {{
        (_resticprofile_effective_targets | map(attribute='_password_file') | list)
        + (
          _resticprofile_effective_targets
          | selectattr('environment', 'defined')
          | selectattr('environment')
          | map(attribute='_environment_file')
          | list
        )
      }}
  when: item.path not in _resticprofile_desired_secret_files
  no_log: true

- name: Initialize rendered Resticprofile profiles
  ansible.builtin.set_fact:
    _resticprofile_profiles: {}
  no_log: true

- name: Build rendered Resticprofile profiles
  ansible.builtin.set_fact:
    _resticprofile_profiles: >-
      {{
        _resticprofile_profiles
        | combine(
            {
              item.name: (
                {
                  'repository': item.repository,
                  'password-file': item._password_file,
                  'backup': {
                    'source': resticprofile_sources,
                    'exclude': resticprofile_excludes,
                    'one-file-system': resticprofile_one_file_system,
                    'tag': resticprofile_tags
                  },
                  'retention': (
                    resticprofile_retention
                    | combine({'after-backup': true, 'prune': true})
                  ),
                  'check': {}
                }
                | combine(
                    (
                      {'env-file': [item._environment_file]}
                      if item.environment | default({}) | length > 0
                      else {}
                    ),
                    recursive=true
                  )
                | combine(
                    (
                      resticprofile_extra_config
                      | combine(item.extra_config | default({}), recursive=true)
                    ),
                    recursive=true,
                    list_merge='append'
                  )
                | combine(
                    (
                      {
                        'backup': {
                          'send-after': [
                            {
                              'method': 'POST',
                              'url': (
                                resticprofile_gatus_url | regex_replace('/+$', '')
                                ~ '/api/v1/endpoints/'
                                ~ (item.gatus_endpoint_key | default(resticprofile_gatus_endpoint_key))
                                ~ '/external?success=true'
                              ),
                              'headers': [
                                {
                                  'name': 'Authorization',
                                  'value': (
                                    'Bearer '
                                    ~ (item.gatus_token | default(resticprofile_gatus_token))
                                  )
                                }
                              ]
                            }
                          ],
                          'send-after-fail': [
                            {
                              'method': 'POST',
                              'url': (
                                resticprofile_gatus_url | regex_replace('/+$', '')
                                ~ '/api/v1/endpoints/'
                                ~ (item.gatus_endpoint_key | default(resticprofile_gatus_endpoint_key))
                                ~ '/external?success=false'
                                ~ '&error=Resticprofile%20backup%20failed'
                              ),
                              'headers': [
                                {
                                  'name': 'Authorization',
                                  'value': (
                                    'Bearer '
                                    ~ (item.gatus_token | default(resticprofile_gatus_token))
                                  )
                                }
                              ]
                            }
                          ]
                        }
                      }
                      if resticprofile_gatus_enabled
                      else {}
                    ),
                    recursive=true,
                    list_merge='append'
                  )
              )
            },
            recursive=true
          )
      }}
  loop: "{{ _resticprofile_effective_targets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Build Resticprofile configuration
  ansible.builtin.set_fact:
    _resticprofile_config_data: >-
      {{
        {
          'version': '1',
          'global': {
            'group-continue-on-error': resticprofile_group_continue_on_error
          },
          'groups': {
            resticprofile_group_name: _resticprofile_target_names
          }
        }
        | combine(_resticprofile_profiles)
      }}
  no_log: true

- name: Write Resticprofile configuration
  ansible.builtin.template:
    src: profiles.yaml.j2
    dest: "{{ resticprofile_config_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false

- name: Install Resticprofile runner
  ansible.builtin.template:
    src: run-resticprofile.sh.j2
    dest: "{{ resticprofile_script_path }}"
    owner: root
    group: root
    mode: '0750'

- name: Ensure Resticprofile log directory exists
  ansible.builtin.file:
    path: "{{ resticprofile_log_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure Resticprofile log file exists
  ansible.builtin.file:
    path: "{{ resticprofile_log_file }}"
    state: touch
    owner: root
    group: root
    mode: "{{ resticprofile_log_mode }}"
    modification_time: preserve
    access_time: preserve

- name: Install Resticprofile logrotate policy
  ansible.builtin.template:
    src: logrotate.j2
    dest: "{{ resticprofile_logrotate_file }}"
    owner: root
    group: root
    mode: '0644'

- name: Install Resticprofile cron schedules
  ansible.builtin.template:
    src: cron.j2
    dest: "{{ resticprofile_cron_file }}"
    owner: root
    group: root
    mode: '0644'
  when:
    - resticprofile_schedule_enabled or resticprofile_check_schedule_enabled

- name: Remove disabled Resticprofile cron schedules
  ansible.builtin.file:
    path: "{{ resticprofile_cron_file }}"
    state: absent
  when:
    - not resticprofile_schedule_enabled
    - not resticprofile_check_schedule_enabled
