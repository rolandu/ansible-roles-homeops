---
- name: Set server identifiers ({{ ovpn_server.vpn_name | default(ovpn_server.name) }})
  set_fact:
    openvpn_vpn_name: "{{ ovpn_server.vpn_name | default(ovpn_server.name) }}"
    openvpn_server_hostname: "{{ ovpn_server.server_hostname | default(inventory_hostname) }}"

- name: Set server facts ({{ openvpn_vpn_name }})
  set_fact:
    openvpn_network: "{{ ovpn_server.network }}"
    openvpn_netmask: "{{ ovpn_server.netmask }}"
    openvpn_port: "{{ ovpn_server.port | default(openvpn_default_port) }}"
    openvpn_proto_base: "{{ (ovpn_server.proto | default(openvpn_default_proto)) | lower }}"
    openvpn_dual_stack: "{{ ovpn_server.dual_stack | default(openvpn_default_dual_stack) }}"
    openvpn_full_tunnel: "{{ ovpn_server.openvpn_full_tunnel | default(openvpn_default_full_tunnel) }}"
    openvpn_remote_host: "{{ ovpn_server.openvpn_remote_host | default(openvpn_server_hostname | default(ansible_host | default(inventory_hostname))) }}"
    openvpn_client_export_dir: "{{ ovpn_server.openvpn_client_export_dir | default(openvpn_default_client_export_dir) }}"
    openvpn_client_local_dir: "{{ openvpn_client_local_dir_base }}/{{ openvpn_vpn_name }}"
    openvpn_server_dir: "{{ ovpn_server.openvpn_server_dir | default(openvpn_default_server_dir) }}"
    easyrsa_dir: "{{ ovpn_server.easyrsa_dir | default(openvpn_default_easyrsa_dir) }}"
    ccd_dir: "{{ ovpn_server.ccd_dir | default(openvpn_default_ccd_dir) }}"
    openvpn_clients: "{{ ovpn_server.clients | default(openvpn_default_clients) }}"
    openvpn_client_to_client: "{{ ovpn_server.openvpn_client_to_client | default(openvpn_default_client_to_client) }}"
    openvpn_dns_servers: "{{ ovpn_server.openvpn_dns_servers | default(openvpn_default_dns_servers) }}"
    openvpn_dns_domain: "{{ ovpn_server.openvpn_dns_domain | default(openvpn_default_dns_domain) }}"
    openvpn_ca_passphrase: "{{ ovpn_server.openvpn_ca_passphrase }}"
    openvpn_ca_build_env: "{{ {'EASYRSA_PASSOUT': 'pass:' + openvpn_ca_passphrase} if openvpn_ca_passphrase | default('') | trim | length > 0 else {} }}"
    openvpn_ca_sign_env: "{{ {'EASYRSA_PASSIN': 'pass:' + openvpn_ca_passphrase} if openvpn_ca_passphrase | default('') | trim | length > 0 else {} }}"
    openvpn_mgmt_password: "{{ ovpn_server.openvpn_mgmt_password }}"
    openvpn_mgmt_port: "{{ ovpn_server.openvpn_mgmt_port | default(openvpn_default_mgmt_port) }}"
    openvpn_mgmt_bind: "{{ ovpn_server.openvpn_mgmt_bind | default(openvpn_default_mgmt_bind) }}"

- name: Build gateway network list ({{ openvpn_vpn_name }})
  set_fact:
    openvpn_gateway_networks: >-
      {{
        openvpn_clients
        | selectattr('type', 'equalto', 'gateway')
        | map(attribute='gateway_networks')
        | select('defined')
        | list
        | flatten
      }}

- name: Validate gateway clients define networks ({{ openvpn_vpn_name }})
  assert:
    that:
      - (ovpn_client.gateway_networks | default([]) | length) > 0
      - (ovpn_client.gateway_networks | default([])) | type_debug == 'list'
    fail_msg: "Gateway client '{{ ovpn_client.name | default('unnamed') }}' in VPN '{{ openvpn_vpn_name }}' must define gateway_networks with at least one entry."
  loop: "{{ openvpn_clients | selectattr('type', 'equalto', 'gateway') | list }}"
  loop_control:
    loop_var: ovpn_client
    label: "{{ ovpn_client.name | default('unnamed') }}"

- name: Validate gateway network entries ({{ openvpn_vpn_name }})
  assert:
    that:
      - ovpn_gateway_network.gateway_network_ip is defined
      - ovpn_gateway_network.gateway_network_ip | string | trim | length > 0
      - ovpn_gateway_network.gateway_network_netmask is defined
      - ovpn_gateway_network.gateway_network_netmask | string | trim | length > 0
    fail_msg: "Gateway client '{{ ovpn_client.name | default('unnamed') }}' in VPN '{{ openvpn_vpn_name }}' must define gateway_network_ip and gateway_network_netmask for each gateway_networks entry."
  vars:
    ovpn_client: "{{ ovpn_gateway_pair.0 }}"
    ovpn_gateway_network: "{{ ovpn_gateway_pair.1 }}"
  loop: "{{ (openvpn_clients | selectattr('type', 'equalto', 'gateway') | list) | subelements('gateway_networks', skip_missing=True) }}"
  loop_control:
    loop_var: ovpn_gateway_pair
    label: "{{ ovpn_gateway_pair.0.name | default('unnamed') }} -> {{ ovpn_gateway_pair.1.gateway_network_ip | default('undefined') }}"

- name: Validate local ignore networks are list ({{ openvpn_vpn_name }})
  when: ovpn_client.local_ignore_networks is defined
  assert:
    that:
      - (ovpn_client.local_ignore_networks | default([])) | type_debug == 'list'
    fail_msg: "Local client '{{ ovpn_client.name | default('unnamed') }}' in VPN '{{ openvpn_vpn_name }}' must define local_ignore_networks as a list."
  loop: "{{ openvpn_clients | selectattr('type', 'equalto', 'local') | list }}"
  loop_control:
    loop_var: ovpn_client
    label: "{{ ovpn_client.name | default('unnamed') }}"

- name: Validate local ignore network entries ({{ openvpn_vpn_name }})
  assert:
    that:
      - ovpn_local_network.gateway_network_ip is defined
      - ovpn_local_network.gateway_network_ip | string | trim | length > 0
      - ovpn_local_network.gateway_network_netmask is defined
      - ovpn_local_network.gateway_network_netmask | string | trim | length > 0
    fail_msg: "Local client '{{ ovpn_client.name | default('unnamed') }}' in VPN '{{ openvpn_vpn_name }}' must define gateway_network_ip and gateway_network_netmask for each local_ignore_networks entry."
  vars:
    ovpn_client: "{{ ovpn_local_pair.0 }}"
    ovpn_local_network: "{{ ovpn_local_pair.1 }}"
  loop: "{{ (openvpn_clients | selectattr('type', 'equalto', 'local') | list) | subelements('local_ignore_networks', skip_missing=True) }}"
  loop_control:
    loop_var: ovpn_local_pair
    label: "{{ ovpn_local_pair.0.name | default('unnamed') }} -> {{ ovpn_local_pair.1.gateway_network_ip | default('undefined') }}"

- name: Set protocol-derived facts ({{ openvpn_vpn_name }})
  set_fact:
    openvpn_proto: "{{ openvpn_proto_base ~ ('6' if openvpn_dual_stack | bool else '4') }}"
    openvpn_client_proto: "{{ openvpn_proto_base }}"
    openvpn_remote_protos: >-
      {{
        [openvpn_proto_base ~ '6', openvpn_proto_base ~ '4']
        if openvpn_dual_stack | bool else
        [openvpn_proto_base ~ '4']
      }}

- name: Normalize DNS domain list ({{ openvpn_vpn_name }})
  set_fact:
    openvpn_dns_domains: >-
      {{
        (
          (openvpn_dns_domain | regex_replace('\\s+', ' ') | trim)
        ).split(' ')
        if openvpn_dns_domain is string
        else (openvpn_dns_domain | flatten)
      }}

- name: Derive DNS domain scopes ({{ openvpn_vpn_name }})
  set_fact:
    openvpn_dns_domains: "{{ (openvpn_dns_domains | reject('equalto', '') | list) or ['.'] }}"
    openvpn_dns_domains_route: "{{ openvpn_dns_domains | map('regex_replace', '^~', '') | list }}"
    openvpn_dns_domains_search: "{{ openvpn_dns_domains | map('regex_replace', '^~?(.*)$', '~\\1') | list }}"

- name: Set derived paths ({{ openvpn_vpn_name }})
  set_fact:
    openvpn_mgmt_password_file: "{{ openvpn_server_dir }}/{{ openvpn_vpn_name }}.mgmtpass"

- name: Ensure OpenVPN group exists ({{ openvpn_vpn_name }})
  group:
    name: openvpn
    system: yes
  notify: Restart OpenVPN server instance

- name: Ensure OpenVPN user exists ({{ openvpn_vpn_name }})
  user:
    name: openvpn
    group: openvpn
    system: yes
    create_home: no
    shell: /usr/sbin/nologin
    state: present
  notify: Restart OpenVPN server instance

- name: Ensure PKI and directories exist ({{ openvpn_vpn_name }})
  block:
    - name: Install OpenVPN and EasyRSA ({{ openvpn_vpn_name }})
      apt:
        name:
          - openvpn
          - easy-rsa
        state: present
        update_cache: yes

    - name: Create EasyRSA directory ({{ openvpn_vpn_name }})
      file:
        path: "{{ easyrsa_dir }}"
        state: directory
        mode: "0750"

    - name: Copy EasyRSA scripts into place ({{ openvpn_vpn_name }})
      copy:
        src: "/usr/share/easy-rsa/"
        dest: "{{ easyrsa_dir }}/"
        owner: root
        group: root
        mode: "0750"
        remote_src: yes

- name: Initialize PKI if not already present ({{ openvpn_vpn_name }})
  command: ./easyrsa init-pki
  args:
    chdir: "{{ easyrsa_dir }}"
    creates: "{{ easyrsa_dir }}/pki"

- name: Build core server certs/keys ({{ openvpn_vpn_name }})
  block:
    - name: Build CA ({{ openvpn_vpn_name }})
      command: ./easyrsa --batch build-ca
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/ca.crt"
      environment: "{{ openvpn_ca_build_env }}"

    - name: Build server certificate ({{ openvpn_vpn_name }})
      command: ./easyrsa --batch build-server-full {{ openvpn_vpn_name }} nopass
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/issued/{{ openvpn_vpn_name }}.crt"
      environment: "{{ openvpn_ca_sign_env }}"

    - name: Generate DH parameters ({{ openvpn_vpn_name }})
      command: ./easyrsa gen-dh
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/dh.pem"

    - name: Generate TLS auth key ({{ openvpn_vpn_name }})
      command: openvpn --genkey --secret ta.key
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/ta.key"
  notify: Restart OpenVPN server instance

- name: Ensure OpenVPN server directory exists ({{ openvpn_vpn_name }})
  file:
    path: "{{ openvpn_server_dir }}"
    state: directory
    owner: openvpn
    group: openvpn
    mode: "u=rwx,g=rwx,o="
  notify: Restart OpenVPN server instance

- name: Write management password file ({{ openvpn_vpn_name }})
  when: openvpn_mgmt_password | default('') | trim | length > 0
  no_log: true
  copy:
    dest: "{{ openvpn_mgmt_password_file }}"
    content: "{{ openvpn_mgmt_password }}\n"
    owner: openvpn
    group: openvpn
    mode: "u=rw,g=rw,o="
  notify: Restart OpenVPN server instance

- name: Ensure CCD directory exists ({{ openvpn_vpn_name }})
  file:
    path: "{{ ccd_dir }}"
    state: directory
    owner: openvpn
    group: openvpn
    mode: "u=rwx,g=rwx,o="
  notify: Restart OpenVPN server instance

- name: Copy PKI material into server dir ({{ openvpn_vpn_name }})
  copy:
    src: "{{ item.src }}"
    dest: "{{ openvpn_server_dir }}/{{ item.dest }}"
    owner: openvpn
    group: openvpn
    mode: "u=rw,g=rw,o="
    remote_src: yes
  loop:
    - { src: "{{ easyrsa_dir }}/pki/ca.crt", dest: "ca.crt" }
    - { src: "{{ easyrsa_dir }}/pki/issued/{{ openvpn_vpn_name }}.crt", dest: "server.crt" }
    - { src: "{{ easyrsa_dir }}/pki/private/{{ openvpn_vpn_name }}.key", dest: "server.key" }
    - { src: "{{ easyrsa_dir }}/pki/dh.pem", dest: "dh.pem" }
    - { src: "{{ easyrsa_dir }}/ta.key", dest: "ta.key" }
  notify: Restart OpenVPN server instance

- name: Deploy OpenVPN server configuration ({{ openvpn_vpn_name }})
  template:
    src: "server.conf.j2"
    dest: "{{ openvpn_server_dir }}/{{ openvpn_vpn_name }}.conf"
    owner: openvpn
    group: openvpn
    mode: "u=rw,g=rw,o="
  notify: Restart OpenVPN server instance

- name: Ensure VPN forwarding sysctls are enforced ({{ openvpn_vpn_name }})
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    reload: yes
  loop:
    - net.ipv4.ip_forward
    - net.ipv4.conf.all.forwarding
    - net.ipv4.conf.default.forwarding
  notify: Restart OpenVPN server instance

- name: Set rp_filter to loose mode for VPN routing ({{ openvpn_vpn_name }})
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "2"
    state: present
    reload: yes
  loop:
    - net.ipv4.conf.all.rp_filter
    - net.ipv4.conf.default.rp_filter
  notify: Restart OpenVPN server instance

- name: Ensure IPv6 dual-stack socket binding is enabled ({{ openvpn_vpn_name }})
  when: openvpn_dual_stack | bool
  ansible.posix.sysctl:
    name: net.ipv6.bindv6only
    value: "0"
    state: present
    reload: yes
  notify: Restart OpenVPN server instance

- name: Verify OpenVPN service is active ({{ openvpn_vpn_name }})
  command: "systemctl is-active openvpn-server@{{ openvpn_vpn_name }}"
  register: openvpn_service_status
  changed_when: false
  failed_when: openvpn_service_status.stdout.strip() not in ['active', 'activating']
  when: not ansible_check_mode
  notify: Restart OpenVPN server instance

- name: Wait for OpenVPN TCP port (if applicable) ({{ openvpn_vpn_name }})
  wait_for:
    port: "{{ openvpn_port }}"
    state: started
    timeout: 30
  when:
    - not ansible_check_mode
    - openvpn_proto_base == 'tcp'
  notify: Restart OpenVPN server instance

- name: Ensure ownership and 0770 on server directories ({{ openvpn_vpn_name }})
  file:
    path: "{{ item }}"
    state: directory
    owner: openvpn
    group: openvpn
    mode: "0770"
  notify: Restart OpenVPN server instance
  loop:
    - "{{ openvpn_server_dir }}"
    - "{{ ccd_dir }}"
    - "{{ openvpn_client_export_dir }}"
  when: not ansible_check_mode

- name: Ensure ownership and clear other perms on server assets ({{ openvpn_vpn_name }})
  file:
    path: "{{ item }}"
    owner: openvpn
    group: openvpn
    mode: "o="
    recurse: yes
  notify: Restart OpenVPN server instance
  loop:
    - "{{ openvpn_server_dir }}"
    - "{{ ccd_dir }}"
    - "{{ openvpn_client_export_dir }}"
  when: not ansible_check_mode

- name: Enable and start OpenVPN service ({{ openvpn_vpn_name }})
  service:
    name: "openvpn-server@{{ openvpn_vpn_name }}"
    enabled: yes
    state: started

- name: Flush handlers for this VPN instance ({{ openvpn_vpn_name }})
  meta: flush_handlers

# Client setup
- name: Build client certificates ({{ openvpn_vpn_name }} - {{ ovpn_client.name }})
  vars:
    ovpn_client_name: "{{ ovpn_client.name }}"
  command: ./easyrsa --batch build-client-full {{ ovpn_client_name }} nopass
  args:
    chdir: "{{ easyrsa_dir }}"
    creates: "{{ easyrsa_dir }}/pki/issued/{{ ovpn_client_name }}.crt"
  environment: "{{ openvpn_ca_sign_env }}"
  loop: "{{ openvpn_clients }}"
  loop_control:
    loop_var: ovpn_client

- name: Render CCD entries per client ({{ openvpn_vpn_name }} - {{ ovpn_client.name }})
  vars:
    ovpn_client_name: "{{ ovpn_client.name }}"
    ovpn_client_type: "{{ ovpn_client.type | default('roaming') }}"
    ovpn_client_static_ip: "{{ ovpn_client.static_ip | default('') }}"
    ovpn_client_gateway_networks: "{{ ovpn_client.gateway_networks | default([]) }}"
  when:
    - (ovpn_client_type in ['gateway', 'roaming', 'local'] and
       (openvpn_gateway_networks | default([]) | length > 0))
      or (ovpn_client_static_ip | default('') | trim | length > 0)
  template:
    src: "ccd-client.j2"
    dest: "{{ ccd_dir }}/{{ ovpn_client_name }}"
    owner: openvpn
    group: openvpn
    mode: "u=rw,g=rw,o="
  loop: "{{ openvpn_clients }}"
  loop_control:
    loop_var: ovpn_client
  notify: Restart OpenVPN server instance

- name: Ensure client export directory exists ({{ openvpn_vpn_name }})
  file:
    path: "{{ openvpn_client_export_dir }}"
    state: directory
    owner: openvpn
    group: openvpn
    mode: "u=rwx,g=rwx,o="
  notify: Restart OpenVPN server instance

- name: Ensure controller export directory exists ({{ openvpn_vpn_name }})
  delegate_to: localhost
  become: false
  file:
    path: "{{ openvpn_client_local_dir }}"
    state: directory
    mode: "0750"

- name: Enable NAT for VPN clients ({{ openvpn_vpn_name }})
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: eth0
    source: "{{ openvpn_network }}/{{ openvpn_netmask }}"
    jump: MASQUERADE
    comment: "NAT for VPN clients"

- name: Export inline client configs locally ({{ openvpn_vpn_name }} - {{ ovpn_client.name }})
  include_tasks: export_client.yml
  loop: "{{ openvpn_clients }}"
  loop_control:
    loop_var: ovpn_client
  vars:
    client_name: "{{ ovpn_client.name }}"
    client_type: "{{ ovpn_client.type | default('roaming') }}"
    client_prefer_vpn_dns: "{{ ovpn_client.prefer_vpn_dns | default(true) | bool }}"
    client_gateway_networks: "{{ ovpn_client.gateway_networks | default([]) }}"
    client_local_ignore_networks: "{{ ovpn_client.local_ignore_networks | default([]) }}"
    client_local_dir: "{{ openvpn_client_local_dir }}"
    client_config_basename: "{{ openvpn_vpn_name }}_{{ client_name }}"
    client_local_config_file: "{{ client_local_dir }}/{{ client_config_basename }}.ovpn"
