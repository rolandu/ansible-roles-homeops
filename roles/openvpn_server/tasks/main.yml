---
- name: Ensure VPN definitions are provided
  assert:
    that:
      - openvpn_config is defined
      - (openvpn_config | default([])) | length > 0
    fail_msg: "Set openvpn_config to the list of VPN definitions."

- name: Validate required fields per VPN definition
  assert:
    that:
      - item.vpn_name is defined
      - item.vpn_name | string | trim | length > 0
      - item.server_hostname is defined
      - item.server_hostname | string | trim | length > 0
      - item.network is defined
      - item.network | string | trim | length > 0
      - item.netmask is defined
      - item.netmask | string | trim | length > 0
      - item.openvpn_ca_passphrase is defined
      - item.openvpn_ca_passphrase is string
      - item.openvpn_ca_passphrase | string | trim | length > 0
      - "'\n' not in item.openvpn_ca_passphrase"
      - "'\r' not in item.openvpn_ca_passphrase"
      - item.openvpn_mgmt_password is defined
      - item.openvpn_mgmt_password | string | trim | length > 0
    fail_msg: >-
      Each VPN entry must define vpn_name, server_hostname, network, netmask,
      a nonempty single-line openvpn_ca_passphrase, and openvpn_mgmt_password.
  no_log: true
  loop: "{{ openvpn_config }}"
  loop_control:
    label: "{{ item.vpn_name | default(item.server_hostname | default('undefined')) }}"

- name: Validate protocol settings per VPN definition
  assert:
    that:
      - (item.proto | default(openvpn_default_proto) | lower) in ['udp', 'tcp']
      - (item.dual_stack | default(openvpn_default_dual_stack)) | type_debug in ['bool']
    fail_msg: "proto must be udp or tcp; dual_stack must be boolean."
  loop: "{{ openvpn_config }}"
  loop_control:
    label: "{{ item.vpn_name | default(item.server_hostname | default('undefined')) }}"

- name: Validate CRL renewal controls
  ansible.builtin.assert:
    that:
      - openvpn_crl_renewal_enabled is boolean
      - openvpn_crl_validity_days | type_debug == 'int'
      - openvpn_crl_renew_before_days | type_debug == 'int'
      - openvpn_crl_renew_before_days | int > 0
      - openvpn_crl_validity_days | int > openvpn_crl_renew_before_days | int
      - openvpn_crl_renewal_schedule is string
      - openvpn_crl_renewal_schedule.split() | length == 5
      - openvpn_crl_renewal_schedule is match('^[0-9*/ ,\-]+$')
    fail_msg: >-
      CRL renewal needs a boolean enable flag, positive integer renewal days
      smaller than the validity days, and a five-field numeric cron schedule.

- name: Validate VPN names used in CRL renewal paths
  ansible.builtin.assert:
    that:
      - item.vpn_name is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
    fail_msg: "vpn_name must contain only letters, digits, underscores and hyphens."
  loop: "{{ openvpn_config }}"
  loop_control:
    label: "{{ item.vpn_name }}"
  no_log: true

- name: Configure OpenVPN server instances
  include_tasks: server_instance.yml
  loop: "{{ openvpn_config | default([]) }}"
  loop_control:
    loop_var: ovpn_server
  when: >
    (ovpn_server.server_hostname | default(inventory_hostname)) in [
      inventory_hostname,
      ansible_hostname | default(inventory_hostname),
      ansible_fqdn | default(inventory_hostname)
    ]
