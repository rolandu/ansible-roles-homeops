---
- name: Gather facts (needed for conditionals)
  ansible.builtin.setup:
    gather_subset: min

- name: Validate required role settings
  ansible.builtin.assert:
    that:
      - certbot_scripts_dir | length > 0
      - certbot_scripts_dir is match('^/')
      - certbot_runner_script_path | length > 0
      - certbot_runner_script_path is match('^/')
      - certbot_auth_hook_path | length > 0
      - certbot_auth_hook_path is match('^/')
      - certbot_certificates_dir | length > 0
      - certbot_certificates_dir is match('^/')
      - certbot_config_dir | length > 0
      - certbot_config_dir is match('^/')
      - certbot_work_dir | length > 0
      - certbot_work_dir is match('^/')
      - certbot_logs_dir | length > 0
      - certbot_logs_dir is match('^/')
      - certbot_cron_schedule | length > 0
      - certbot_shared_group | length > 0
      - certbot_dir_mode is match('^0?[0-7]{3,4}$')
      - certbot_file_mode is match('^0?[0-7]{3,4}$')
      - hcloud_zone | length > 0
      - hcloud_token | length > 0
      - certbot_email | length > 0
      - certbot_lineages | length > 0
    fail_msg: >-
      certbot_hetzner is missing required settings. Ensure hcloud_zone,
      hcloud_token, certbot_email, certbot_lineages, and path/group settings are set.

- name: Validate certbot lineages entries
  ansible.builtin.assert:
    that:
      - item.domain is defined
      - item.certname is defined
      - item.domain | string | length > 0
      - item.certname | string | length > 0
    fail_msg: "Each certbot_lineages item needs non-empty domain and certname: {{ item }}"
  loop: "{{ certbot_lineages }}"
  loop_control:
    label: "{{ item.domain if (item.domain is defined) else '<missing-domain>' }}"

- name: Ensure base tools are present (jq, dig)
  ansible.builtin.package:
    name: >-
      {{
        (ansible_os_family == 'RedHat') | ternary(
          ['jq','bind-utils'],
          ['jq','dnsutils']
        )
      }}
    state: present

# -----------------------------
# Certbot installation options
# -----------------------------
- name: Install Certbot via OS packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: certbot
    state: present
    update_cache: true
  when: not use_venv and ansible_os_family == 'Debian'

- name: Install Certbot via OS packages (RHEL family)
  ansible.builtin.yum:
    name: certbot
    state: present
  when: not use_venv and ansible_os_family == 'RedHat'

- name: Ensure Python + venv bits for Certbot venv
  ansible.builtin.package:
    name: >-
      {{
        (ansible_os_family == 'RedHat') | ternary(
          ['python3','python3-virtualenv','gcc'],
          ['python3','python3-venv','gcc','libaugeas-dev']
        )
      }}
    state: present
  when: use_venv

- name: Create Certbot virtualenv directory
  ansible.builtin.file:
    path: "{{ certbot_venv_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: use_venv

- name: Create virtualenv for Certbot
  ansible.builtin.command: >-
    python3 -m venv {{ certbot_venv_path }}
  args:
    creates: "{{ certbot_venv_path }}/bin/activate"
  when: use_venv

- name: Upgrade pip inside venv
  ansible.builtin.command: >-
    {{ certbot_venv_path }}/bin/pip install --upgrade pip
  when: use_venv

- name: Install certbot (and optional plugins) via pip in venv
  ansible.builtin.command: >-
    {{ certbot_venv_path }}/bin/pip install
    certbot{{ install_certbot_nginx | ternary(' certbot-nginx','') }}
  when: use_venv

- name: Symlink venv certbot into PATH
  ansible.builtin.file:
    src: "{{ certbot_venv_path }}/bin/certbot"
    dest: /usr/local/bin/certbot
    state: link
    force: true
  when: use_venv

# -----------------------------
# Hetzner Cloud CLI installation
# -----------------------------
- name: Check if hcloud is already available
  ansible.builtin.command: bash -lc 'command -v hcloud'
  register: hcloud_cmd
  changed_when: false
  failed_when: false

- name: Download hcloud CLI tarball (GitHub latest)
  ansible.builtin.get_url:
    url: "{{ hcloud_download_url }}"
    dest: /tmp/hcloud-linux-amd64.tar.gz
    mode: '0644'
  when: hcloud_cmd.rc != 0

- name: Unpack hcloud binary
  ansible.builtin.unarchive:
    src: /tmp/hcloud-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["hcloud"]
  when: hcloud_cmd.rc != 0

- name: Ensure hcloud binary is executable
  ansible.builtin.file:
    path: "{{ hcloud_binary_path }}"
    mode: '0755'
    owner: root
    group: root
    state: file
  when: hcloud_cmd.rc != 0

# -----------------------------
# Directories, scripts, cron
# -----------------------------
- name: Ensure certificate sharing group exists
  ansible.builtin.group:
    name: "{{ certbot_shared_group }}"
    state: present

- name: Ensure certbot script directory exists
  ansible.builtin.file:
    path: "{{ certbot_scripts_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure certificate directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ certbot_shared_group }}"
    mode: "{{ certbot_dir_mode }}"
  loop: "{{ [certbot_certificates_dir, certbot_config_dir, certbot_work_dir, certbot_logs_dir] | unique }}"

- name: Ensure certbot cron log file exists with shared access
  ansible.builtin.file:
    path: "{{ certbot_cron_log_file }}"
    state: touch
    owner: root
    group: "{{ certbot_shared_group }}"
    mode: "{{ certbot_file_mode }}"

- name: Deploy Hetzner DNS hook script
  ansible.builtin.copy:
    src: dns-auth-hetzner.sh
    dest: "{{ certbot_auth_hook_path }}"
    owner: root
    group: root
    mode: '0750'

- name: Render certbot runner script
  ansible.builtin.template:
    src: certbot-script.sh.j2
    dest: "{{ certbot_runner_script_path }}"
    owner: root
    group: root
    mode: '0750'

- name: Install cron for scheduled renew
  ansible.builtin.copy:
    dest: /etc/cron.d/certbot-hcloud-renew
    owner: root
    group: root
    mode: '0644'
    content: |
      # Run the Hetzner DNS-01 renewal helper on configured schedule. Log to separate file.
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MAILTO=""
      # minute hour day month weekday user command
      {{ certbot_cron_schedule }} root {{ certbot_runner_script_path }} >>{{ certbot_cron_log_file }} 2>&1
