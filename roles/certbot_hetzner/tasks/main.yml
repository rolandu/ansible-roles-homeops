---
- name: Gather facts (needed for conditionals)
  ansible.builtin.setup:
    gather_subset: min

- name: Validate required role settings
  ansible.builtin.assert:
    that:
      - certbot_scripts_dir | length > 0
      - certbot_scripts_dir is match('^/')
      - certbot_runner_script_path | length > 0
      - certbot_runner_script_path is match('^/')
      - certbot_auth_hook_path | length > 0
      - certbot_auth_hook_path is match('^/')
      - certbot_certificates_dir | length > 0
      - certbot_certificates_dir is match('^/')
      - certbot_config_dir | length > 0
      - certbot_config_dir is match('^/')
      - certbot_work_dir | length > 0
      - certbot_work_dir is match('^/')
      - certbot_logs_dir | length > 0
      - certbot_logs_dir is match('^/')
      - certbot_cron_schedule | length > 0
      - certbot_shared_group | length > 0
      - certbot_dir_mode is match('^0?[0-7]{3,4}$')
      - certbot_file_mode is match('^0?[0-7]{3,4}$')
      - hcloud_zone | length > 0
      - hcloud_token | length > 0
      - certbot_email | length > 0
      - certbot_lineages | length > 0
    fail_msg: >-
      certbot_hetzner is missing required settings. Ensure hcloud_zone,
      hcloud_token, certbot_email, certbot_lineages, and path/group settings are set.

- name: Validate certbot lineages entries
  ansible.builtin.assert:
    that:
      - item.domain is defined
      - item.certname is defined
      - item.domain | string | length > 0
      - item.certname | string | length > 0
    fail_msg: "Each certbot_lineages item needs non-empty domain and certname: {{ item }}"
  loop: "{{ certbot_lineages }}"
  loop_control:
    label: "{{ item.domain if (item.domain is defined) else '<missing-domain>' }}"

- name: Ensure base tools are present (jq, dig)
  ansible.builtin.package:
    name: >-
      {{
        (ansible_os_family == 'RedHat') | ternary(
          ['jq','bind-utils'],
          ['jq','dnsutils']
        )
      }}
    state: present

# -----------------------------
# Certbot installation
# -----------------------------
- name: Install Certbot via OS packages
  ansible.builtin.package:
    name: certbot
    state: present

# -----------------------------
# Hetzner Cloud CLI installation
# -----------------------------
- name: Ensure managed hcloud bin directory exists
  ansible.builtin.file:
    path: "{{ app_root_dir }}/bin"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check installed hcloud version from PATH
  ansible.builtin.shell: >-
    if command -v hcloud >/dev/null 2>&1; then
      hcloud version
    fi
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ app_root_dir }}/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  register: hcloud_version_cmd
  changed_when: false
  failed_when: false

- name: Record installed hcloud version
  ansible.builtin.set_fact:
    hcloud_installed_version: >-
      {{ hcloud_version_cmd.stdout.split()[1] if (hcloud_version_cmd.stdout.split() | length) > 1 else '' }}

- name: Download hcloud CLI tarball
  ansible.builtin.get_url:
    url: "{{ hcloud_download_url }}"
    dest: "/tmp/hcloud-linux-amd64-v{{ hcloud_version }}.tar.gz"
    mode: '0644'
  when: hcloud_installed_version != hcloud_version

- name: Unpack hcloud binary
  ansible.builtin.unarchive:
    src: "/tmp/hcloud-linux-amd64-v{{ hcloud_version }}.tar.gz"
    dest: "{{ app_root_dir }}/bin"
    remote_src: true
    extra_opts: ["hcloud"]
  when: hcloud_installed_version != hcloud_version

- name: Ensure hcloud binary is executable
  ansible.builtin.file:
    path: "{{ app_root_dir }}/bin/hcloud"
    mode: '0755'
    owner: root
    group: root
    state: file
  when: hcloud_installed_version != hcloud_version

- name: Record managed hcloud binary path
  ansible.builtin.set_fact:
    hcloud_managed_binary_path: "{{ app_root_dir }}/bin/hcloud"

# -----------------------------
# Directories, scripts, cron
# -----------------------------
- name: Ensure certificate sharing group exists
  ansible.builtin.group:
    name: "{{ certbot_shared_group }}"
    state: present

- name: Ensure certbot script directory exists
  ansible.builtin.file:
    path: "{{ certbot_scripts_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure certificate directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ certbot_shared_group }}"
    mode: "{{ certbot_dir_mode }}"
  loop: "{{ [certbot_certificates_dir, certbot_config_dir, certbot_work_dir, certbot_logs_dir] | unique }}"

- name: Check if certbot cron log file exists
  ansible.builtin.stat:
    path: "{{ certbot_cron_log_file }}"
  register: certbot_cron_log_stat

- name: Create certbot cron log file if missing
  ansible.builtin.file:
    path: "{{ certbot_cron_log_file }}"
    state: touch
    owner: root
    group: "{{ certbot_shared_group }}"
    mode: "{{ certbot_file_mode }}"
  when: not certbot_cron_log_stat.stat.exists

- name: Ensure certbot cron log file permissions
  ansible.builtin.file:
    path: "{{ certbot_cron_log_file }}"
    state: file
    owner: root
    group: "{{ certbot_shared_group }}"
    mode: "{{ certbot_file_mode }}"

- name: Deploy Hetzner DNS hook script
  ansible.builtin.template:
    src: certbot-dns-hook-hetzner.sh.j2
    dest: "{{ certbot_auth_hook_path }}"
    owner: root
    group: root
    mode: '0750'

- name: Render certbot runner script
  ansible.builtin.template:
    src: certbot-hetzner-run.sh.j2
    dest: "{{ certbot_runner_script_path }}"
    owner: root
    group: root
    mode: '0750'

# Cleanup legacy script names that might have been used in older versions of the role
# Will only run if "--tags cleanup" is specified, and will not remove current script paths
- name: Remove legacy certbot script names
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ certbot_scripts_dir }}/certbot-script.sh"
    - "{{ certbot_scripts_dir }}/dns-auth-hetzner.sh"
    - /etc/letsencrypt/certbot-script.sh
    - /etc/letsencrypt/dns-auth-hetzner.sh
  when: item not in [certbot_runner_script_path, certbot_auth_hook_path]
  tags:
    - never
    - cleanup

- name: Install cron for scheduled renew
  ansible.builtin.copy:
    dest: /etc/cron.d/certbot-hcloud-renew
    owner: root
    group: root
    mode: '0644'
    content: |
      # Run the Hetzner DNS-01 renewal helper on configured schedule. Log to separate file.
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MAILTO=""
      # minute hour day month weekday user command
      {{ certbot_cron_schedule }} root {{ certbot_runner_script_path }} >>{{ certbot_cron_log_file }} 2>&1
