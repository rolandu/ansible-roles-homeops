---
# first verify that this system is in fact using NetworkManager
- name: Gather service facts
  service_facts:

- name: Gather package facts
  package_facts:
    manager: auto

- name: Check if NetworkManager OpenVPN plugin is installed
  set_fact:
    openvpn_client_nm_plugin_installed: "{{ 'network-manager-openvpn' in ansible_facts.packages }}"

- name: Assert NetworkManager is running
  assert:
    that:
      - "'NetworkManager.service' in ansible_facts.services"
      - ansible_facts.services['NetworkManager.service'].state == 'running'
    fail_msg: >-
      NetworkManager is installed but not running; enable/start NetworkManager
      or remove it to use the openvpn-client path.

- name: Check NetworkManager runtime state
  command: nmcli -t -f RUNNING general
  register: openvpn_client_nm_running
  changed_when: false

- name: Assert NetworkManager is managing networking
  assert:
    that:
      - openvpn_client_nm_running.stdout | trim | lower == 'running'
    fail_msg: >-
      NetworkManager is not running according to nmcli; ensure it is managing
      networking before using the NetworkManager path.

- name: Install NetworkManager OpenVPN plugin
  apt:
    name: network-manager-openvpn
    state: present
    update_cache: yes
  when: not openvpn_client_nm_plugin_installed | bool
  register: openvpn_client_nm_plugin

- name: Reload NetworkManager after plugin install
  when: openvpn_client_nm_plugin is changed
  command: nmcli general reload
  changed_when: false

# if the client is configured to use gateway sysctls, enforce them now
- name: Enforce gateway sysctls when required
  include_tasks: manage_client_gateway.yml

# the dispatcher script ensures that the OpenVPN connection is established as soon as a network connection is available
- name: Ensure NetworkManager dispatcher directory exists
  when: openvpn_client_nm_autoconnect_dispatcher | bool
  file:
    path: /etc/NetworkManager/dispatcher.d
    state: directory
    mode: '0755'

- name: Install NetworkManager dispatcher autoconnect script
  when: openvpn_client_nm_autoconnect_dispatcher | bool
  template:
    src: nm-openvpn-autoconnect.sh.j2
    dest: /etc/NetworkManager/dispatcher.d/90-openvpn-autoconnect
    mode: '0755'

- name: Remove NetworkManager dispatcher autoconnect script when disabled
  when: not openvpn_client_nm_autoconnect_dispatcher | bool
  file:
    path: /etc/NetworkManager/dispatcher.d/90-openvpn-autoconnect
    state: absent

# manage the OpenVPN connection in NetworkManager
- name: List existing NetworkManager connections
  command: nmcli -t -f NAME connection show
  register: openvpn_client_nm_connections
  changed_when: false

- name: Mark existing NetworkManager connection
  set_fact:
    openvpn_client_nm_connection_exists: >-
      {{ openvpn_client_connection_name in openvpn_client_nm_connections.stdout_lines }}

- name: Drop existing connection when config changed
  when:
    - openvpn_client_config_copy.changed
    - openvpn_client_nm_connection_exists | bool
  command: nmcli connection delete "{{ openvpn_client_connection_name }}"
  register: openvpn_client_nm_delete
  changed_when: openvpn_client_nm_delete.rc == 0

- name: Import OpenVPN connection into NetworkManager
  when: openvpn_client_config_copy.changed or (not openvpn_client_nm_connection_exists | bool)
  command: >-
    nmcli connection import type openvpn
    file "{{ openvpn_client_conf_dir }}/{{ openvpn_client_connection_name }}.conf"
  register: openvpn_client_nm_import
  changed_when: openvpn_client_nm_import.rc == 0

- name: Refresh NetworkManager connection presence after import
  command: nmcli -t -f NAME connection show
  register: openvpn_client_nm_connections_post
  changed_when: false

- name: Assert NetworkManager connection exists after import
  assert:
    that:
      - openvpn_client_connection_name in openvpn_client_nm_connections_post.stdout_lines
    fail_msg: >-
      NetworkManager connection {{ openvpn_client_connection_name }} is missing after import.

# make sure networkmanager keeps the connection alive
- name: Ensure NetworkManager base connection settings
  command: >-
    nmcli connection modify "{{ openvpn_client_connection_name }}"
    vpn.timeout 30
    connection.autoconnect yes
    connection.autoconnect-retries 0
    +vpn.data "ping=10"
    +vpn.data "ping-restart=60"
  changed_when: false

# networkmanager has a strange behavior: it sets the default route through
# the VPN connection even for split-tunnel configs, even if the VPN doesn't
# push a default route. To work around this, we need to explicitly tell 
# NetworkManager not set a default route for split-tunnel configs.
#
# In addition, gateway clients must never set a default route through the VPN, 
# even if the server pushes one, since that would break connectivity for the
# local network that the gateway is supposed to be providing access to.
- name: Disable VPN default route for split-tunnel configs
  when:
    - not (openvpn_full_tunnel | default(false) | bool) or ((openvpn_client_role | default('') | lower) == 'gateway')
  command: >-
    nmcli connection modify "{{ openvpn_client_connection_name }}"
    ipv4.never-default yes
    ipv6.never-default yes
  changed_when: false

# If we configured the VPN to prefer the DNS server that was provided by the
# VPN, we need to set the DNS priority to ensure that it is preferred over any
# other DNS servers that may be configured on the system.
- name: Prefer VPN DNS in NetworkManager connection
  when:
    - openvpn_client_prefer_vpn_dns | default(true) | bool
  command: >-
    nmcli connection modify "{{ openvpn_client_connection_name }}"
    ipv4.ignore-auto-dns no
    ipv4.dns-priority -50
  changed_when: false

- name: Force VPN DNS routing domains in NetworkManager connection
  when:
    - openvpn_client_prefer_vpn_dns | default(true) | bool
    - openvpn_dns_servers | length > 0
  command: >-
    nmcli connection modify "{{ openvpn_client_connection_name }}"
    ipv4.dns-search "{{ openvpn_dns_domains_search | join(',') }}"
    ipv6.dns-search "{{ openvpn_dns_domains_search | join(',') }}"
  changed_when: false

- name: Bring down NetworkManager connection before restart
  command: nmcli connection down "{{ openvpn_client_connection_name }}"
  failed_when: false
  changed_when: false

- name: Bring up NetworkManager connection
  command: nmcli connection up "{{ openvpn_client_connection_name }}"
  register: openvpn_client_nm_up
  changed_when: openvpn_client_nm_up.rc == 0
