---
- name: Fail if NetworkManager is running
  when: openvpn_client_nm_service_running | default(false) | bool
  fail:
    msg: >-
      NetworkManager is running on this host; refusing to manage the client via
      openvpn-client. Stop/disable NetworkManager or let it manage the VPN instead.

- name: Install OpenVPN client package
  apt:
    name: openvpn
    state: present
    update_cache: yes
  register: openvpn_client_package
  notify: Restart OpenVPN client service

- name: Set service unit
  set_fact:
    openvpn_client_systemd_unit: >-
      {{
        'openvpn-client@' + (openvpn_vpn_name + '_' + openvpn_client_name)
      }}

# section of steps to wire DNS updates to the appropriate resolver
- name: Gather service facts
  service_facts:

- name: Detect DNS resolver for OpenVPN client
  set_fact:
    openvpn_client_dns_handler: >-
      {{
        'systemd-resolved'
        if (
          ansible_facts.services is defined and
          ansible_facts.services.get('systemd-resolved.service', {}).state == 'running'
        )
        else 'resolvconf'
      }}

- name: Ensure systemd-resolved helper package is present when needed
  when: openvpn_client_dns_handler == 'systemd-resolved'
  apt:
    name: openvpn-systemd-resolved
    state: present
    update_cache: yes
  register: openvpn_client_resolved_package
  notify: Restart OpenVPN client service

- name: Define DNS update script candidates
  set_fact:
    openvpn_client_dns_script_candidates: >-
      {{
        (
          ([openvpn_client_update_resolvconf_path]
            | select('string')
            | map('trim')
            | select('length')
            | list)
        )
        +
        (
          [
            '/etc/openvpn/update-systemd-resolved',
            '/usr/lib/openvpn/update-systemd-resolved',
            '/usr/share/doc/openvpn/examples/sample-scripts/update-systemd-resolved'
          ] if openvpn_client_dns_handler == 'systemd-resolved'
          else [
            '/etc/openvpn/update-resolv-conf',
            '/usr/lib/openvpn/update-resolv-conf',
            '/usr/share/doc/openvpn/examples/sample-scripts/update-resolv-conf',
            '/etc/openvpn/scripts/update-resolv-conf'
          ]
        )
      }}

- name: Check DNS update script candidates
  stat:
    path: "{{ item }}"
  loop: "{{ openvpn_client_dns_script_candidates }}"
  register: openvpn_client_dns_script_stats

- name: Select DNS update script path
  set_fact:
    openvpn_client_dns_script_path: >-
      {{
        (openvpn_client_dns_script_stats.results
          | selectattr('stat.exists', 'equalto', true)
          | map(attribute='item')
          | list
          | first)
        | default('')
      }}

- name: Fail when DNS update script is missing
  when: openvpn_client_dns_script_path | length == 0
  fail:
    msg: >-
      No DNS update script found for resolver handler {{ openvpn_client_dns_handler }}.
      Checked: {{ openvpn_client_dns_script_candidates | join(', ') }}.

- name: Set DNS hook options for override
  set_fact:
    openvpn_client_dns_use_down_pre: "{{ openvpn_client_dns_handler == 'systemd-resolved' }}"
    openvpn_client_dns_path_env: >-
      {{
        '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
        if openvpn_client_dns_handler == 'systemd-resolved'
        else ''
      }}

- name: Check OpenVPN client unit locations
  stat:
    path: "{{ item }}"
  loop:
    - /lib/systemd/system/openvpn-client@.service
    - /usr/lib/systemd/system/openvpn-client@.service
  register: openvpn_client_unit_stats

- name: Select OpenVPN client unit path
  set_fact:
    openvpn_client_unit_path: >-
      {{
        (openvpn_client_unit_stats.results
          | selectattr('stat.exists', 'equalto', true)
          | map(attribute='item')
          | list
          | first)
        | default('')
      }}

- name: Fail when OpenVPN client unit is missing
  when: openvpn_client_unit_path | length == 0
  fail:
    msg: >-
      Could not locate openvpn-client@.service. Checked /lib/systemd/system and
      /usr/lib/systemd/system.

- name: Read OpenVPN client unit
  when: openvpn_client_unit_path | length > 0
  slurp:
    src: "{{ openvpn_client_unit_path }}"
  register: openvpn_client_unit_slurp

- name: Extract ExecStart from unit
  set_fact:
    openvpn_client_unit_execstart: >-
      {{
        (openvpn_client_unit_slurp.content | b64decode).splitlines()
          | select('match', '^ExecStart=')
          | map('regex_replace', '^ExecStart=', '')
          | list
          | first
          | default('')
      }}

- name: Fail when ExecStart is missing
  when: openvpn_client_unit_execstart | length == 0
  fail:
    msg: "Failed to extract ExecStart from {{ openvpn_client_unit_path }}."

- name: Ensure systemd override directory exists
  file:
    path: "/etc/systemd/system/{{ openvpn_client_systemd_unit }}.service.d"
    state: directory
    mode: "0755"

- name: Install OpenVPN client systemd override for DNS
  template:
    src: openvpn-client-override.conf.j2
    dest: "/etc/systemd/system/{{ openvpn_client_systemd_unit }}.service.d/override.conf"
    mode: "0644"
  register: openvpn_client_systemd_override
  notify:
    - Reload systemd
    - Restart OpenVPN client service
# end of DNS resolver wiring

- name: Enforce gateway sysctls when required
  include_tasks: manage_client_gateway.yml

- name: Enable and start OpenVPN client service
  systemd:
    name: "{{ openvpn_client_systemd_unit }}"
    enabled: yes
    state: started
    daemon_reload: yes
  notify: Restart OpenVPN client service
