---
# These tasks are run per client per server configured

- name: Set connection name for client
  set_fact:
    openvpn_client_connection_name: "{{ openvpn_vpn_name }}_{{ openvpn_client_name }}"

- name: Validate local .ovpn artifact exists on controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ openvpn_client_local_config_file }}"
  register: openvpn_client_local_config_stat
  failed_when: not openvpn_client_local_config_stat.stat.exists

- name: Ensure client config directory exists
  file:
    path: "{{ openvpn_client_conf_dir }}"
    state: directory
    mode: "0755"
  notify: Restart OpenVPN client service

- name: Copy inline .ovpn from controller to target as .conf
  copy:
    src: "{{ openvpn_client_local_config_file }}"
    dest: "{{ openvpn_client_conf_dir }}/{{ openvpn_client_connection_name }}.conf"
    owner: root
    group: root
    mode: "0600"
  register: openvpn_client_config_copy
  notify: Restart OpenVPN client service

# Checking what is installed and running
- name: Gather installed packages
  package_facts:
    manager: auto

- name: Gather service facts
  service_facts:

- name: Detect NetworkManager
  vars:
    nm_pkg: "{{ 'network-manager' in ansible_facts.packages }}"
  set_fact:
    openvpn_client_nm_pkg_installed: "{{ nm_pkg }}"

- name: Check if NetworkManager is active
  vars:
    nm_running: >-
      {{
        ansible_facts.services is defined and
        ansible_facts.services.get('NetworkManager.service', {}).state == 'running'
      }}
  set_fact:
    openvpn_client_nm_service_running: "{{ nm_running }}"

- name: Ensure enabled watchdog uses NetworkManager
  when: openvpn_client_watchdog_enabled | default(false) | bool
  assert:
    that:
      - openvpn_client_nm_pkg_installed | bool
      - openvpn_client_nm_service_running | bool
    fail_msg: >-
      The OpenVPN watchdog requires NetworkManager to be installed and running
      because it repairs the connection with nmcli.

# Only if both checks are true, manage via NetworkManager
- name: Manage OpenVPN client via NetworkManager
  when: openvpn_client_nm_pkg_installed | bool and openvpn_client_nm_service_running | bool
  include_tasks: manage_client_networkmanager.yml

# If either check is false, manage via openvpn-client
- name: Manage OpenVPN client via openvpn-client
  when: not (openvpn_client_nm_pkg_installed | bool and openvpn_client_nm_service_running | bool)
  include_tasks: manage_client_openvpn.yml
