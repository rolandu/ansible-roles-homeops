---
- name: Remove Borgmatic backup managed files and directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      [
        borgmatic_backup_cron_file,
        borgmatic_backup_logrotate_file,
        borgmatic_backup_config_dir,
        borgmatic_backup_borg_path,
        borgmatic_backup_borgmatic_path,
        borgmatic_backup_venv_path,
        borgmatic_backup_install_root,
        borgmatic_backup_log_file
      ] | unique
    }}
