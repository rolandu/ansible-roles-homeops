---
- name: Run an arbitrary Borgmatic command on one backup host
  hosts: "{{ borgmatic_target | default('role_backup:!disabled') }}"
  gather_facts: false
  become: true
  any_errors_fatal: true

  vars:
    _borgmatic_command_binary: >-
      {{ borgmatic_backup_borgmatic_path | default('/usr/local/bin/borgmatic') }}
    _borgmatic_command_config: >-
      {{ borgmatic_backup_config_path | default('/etc/borgmatic/config.yaml') }}

  pre_tasks:
    - name: Require exactly one selected Borgmatic host
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
        fail_msg: >-
          Select exactly one Borgmatic host with --limit or borgmatic_target.
      run_once: true

    - name: Validate Borgmatic command arguments
      ansible.builtin.assert:
        that:
          - borgmatic_cli_args is defined or borgmatic_cli is defined
          - not (borgmatic_cli_args is defined and borgmatic_cli is defined)
        fail_msg: >-
          Set exactly one of borgmatic_cli_args, as a list of arguments, or
          borgmatic_cli, as a single command string.
      run_once: true

    - name: Validate Borgmatic argument list
      ansible.builtin.assert:
        that:
          - borgmatic_cli_args | type_debug == 'list'
          - borgmatic_cli_args | length > 0
        fail_msg: borgmatic_cli_args must be a non-empty list of arguments.
      when: borgmatic_cli_args is defined
      run_once: true

    - name: Validate each Borgmatic command argument
      ansible.builtin.assert:
        that:
          - item is string
          - item is not search('[\r\n]')
        fail_msg: Every borgmatic_cli_args item must be a single-line string.
      loop: "{{ borgmatic_cli_args | default([]) }}"
      when: borgmatic_cli_args is defined
      run_once: true

    - name: Validate Borgmatic command string
      ansible.builtin.assert:
        that:
          - borgmatic_cli | type_debug == 'str'
          - borgmatic_cli | length > 0
          - borgmatic_cli is not search('[\r\n]')
        fail_msg: borgmatic_cli must be a non-empty single-line command string.
      when: borgmatic_cli is defined
      run_once: true

  tasks:
    - name: Execute Borgmatic with the managed configuration from argument list
      ansible.builtin.command:
        argv: >-
          {{
            [
              _borgmatic_command_binary,
              '--config',
              _borgmatic_command_config
            ]
            + borgmatic_cli_args
          }}
      environment:
        NO_COLOR: "1"
      register: _borgmatic_command_result
      # The playbook deliberately forwards arbitrary actions and therefore
      # cannot infer whether Borgmatic changed repository state.
      changed_when: true
      failed_when: false
      no_log: true
      when: borgmatic_cli_args is defined

    - name: Execute Borgmatic with the managed configuration from command string
      ansible.builtin.command:
        cmd: >-
          {{ _borgmatic_command_binary | quote }}
          --config {{ _borgmatic_command_config | quote }}
          {{ borgmatic_cli }}
      environment:
        NO_COLOR: "1"
      register: _borgmatic_command_result
      # The playbook deliberately forwards arbitrary actions and therefore
      # cannot infer whether Borgmatic changed repository state.
      changed_when: true
      failed_when: false
      no_log: true
      when: borgmatic_cli is defined

    - name: Show Borgmatic stdout
      ansible.builtin.debug:
        msg: "{{ _borgmatic_command_result.stdout }}"
      when: _borgmatic_command_result.stdout | length > 0

    - name: Show Borgmatic stderr
      ansible.builtin.debug:
        msg: "{{ _borgmatic_command_result.stderr }}"
      when: _borgmatic_command_result.stderr | length > 0

    - name: Fail when Borgmatic command failed
      ansible.builtin.fail:
        msg: >-
          Borgmatic command failed with return code
          {{ _borgmatic_command_result.rc }}.
      when: _borgmatic_command_result.rc != 0
