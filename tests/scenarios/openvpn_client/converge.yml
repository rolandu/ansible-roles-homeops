---
- name: Converge OpenVPN client watchdog
  hosts: openvpn_client_targets
  become: true
  gather_facts: false

  vars:
    openvpn_client_connection_name: scenario_vpn_client
    openvpn_client_watchdog_enabled: true
    openvpn_client_watchdog_interval: "*/5 * * * *"
    openvpn_client_watchdog_dig_target: vpn.example.test
    openvpn_client_watchdog_ping_target: 10.200.0.1

  tasks:
    - name: Include OpenVPN client watchdog tasks
      ansible.builtin.include_role:
        name: openvpn_client
        tasks_from: manage_client_watchdog
