---
- name: Disable Docker Compose project automatic updates
  hosts: docker_compose_project_targets
  become: true
  gather_facts: true

  vars:
    scenario_service_name: new-service

  tasks:
    - name: Disable scenario project automatic updates
      ansible.builtin.include_role:
        name: docker_compose_project
      vars:
        docker_compose_project_name: compose-scenario
        docker_compose_project_dir: /opt/compose-scenario
        docker_compose_project_docker_cli: /usr/local/bin/docker
        docker_compose_project_compose:
          src: "{{ playbook_dir }}/templates/compose.yml.j2"
          filename: compose.yml
          owner: root
          group: root
          mode: '0640'
          sensitive: false
        docker_compose_project_deploy:
          pull: missing
          wait: true
          wait_timeout: 30
          remove_orphans: false
          down_on_compose_change: true
          recreate_on_managed_change: true
        docker_compose_project_updates:
          enabled: false
